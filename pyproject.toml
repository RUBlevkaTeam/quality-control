[project]
name = "quality-control"
version = "0.1.0"
description = "Local experiments and submission pipeline for E-CUP Quality Control"
requires-python = ">=3.11,<3.15"
dependencies = [
    "joblib>=1.4,<2",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "pillow>=10,<13",
    "scikit-learn>=1.6,<2",
    "scipy>=1.11,<2",
]

[project.optional-dependencies]
notebook = [
    "jupyter>=1.1,<2",
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<1",
]
submission = [
    "accelerate>=1.0,<2",
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
    "transformers>=5.0,<6",
]
tracking = [
    "wandb>=0.21,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
